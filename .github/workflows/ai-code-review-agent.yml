name: Trigger AI Code Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - "**"

jobs:
  trigger-review-agent:
    runs-on: ubuntu-latest

    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Start Spring Boot Agent
        run: |
          echo "Starting Spring Boot AI Code Review Agent..."
          nohup mvn spring-boot:run > app.log 2>&1 &
          sleep 35
          cat app.log

      - name: Trigger Review API
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_PART='"pull_request": {"number": ${{ github.event.pull_request.number }}}'
          else
            PR_PART='"pull_request": null'
          fi

          curl -X POST "http://localhost:8080/api/reviews/github-webhook" \
            -H "Content-Type: application/json" \
            -d "{\"action\": \"${{ github.event.action }}\", \"ref\": \"${{ github.ref }}\", \"repository\": {\"name\": \"${{ github.event.repository.name }}\", \"owner\": {\"login\": \"${{ github.repository_owner }}\"}}, ${PR_PART}}"

      - name: Show App Logs
        if: always()
        run: |
          cat app.log